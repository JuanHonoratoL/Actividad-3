spring.application.name=actividad3

# URL directa a tu cluster de Aiven con SSL requerido
spring.datasource.url=jdbc:mysql://testing-testingjp.a.aivencloud.com:13183/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect